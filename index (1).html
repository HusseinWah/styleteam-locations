<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StyleTeam Lighting — Find a Showroom Near You</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #CC0000;
    --red-light: #FF2222;
    --red-dim: rgba(204,0,0,0.15);
    --dark: #0C0C0C;
    --dark2: #161616;
    --dark3: #1F1F1F;
    --text: #F5F5F5;
    --text-muted: #888;
    --border: rgba(204,0,0,0.18);
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 1rem 3rem;
    overflow-x: hidden;
  }

  /* Radial glow behind logo */
  body::before {
    content: '';
    position: fixed;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(204,0,0,0.1) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle grid pattern */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(204,0,0,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(204,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.7s ease both;
  }

  .logo-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 1.5rem;
    position: relative;
  }

  .logo-wrap::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204,0,0,0.2), transparent 70%);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    position: relative;
    z-index: 1;
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 0.4rem;
  }

  .brand-name span {
    color: var(--red);
  }

  .tagline {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 2rem auto;
    width: 100%;
    max-width: 360px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(204,0,0,0.4), transparent);
  }

  .divider-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0.7;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--red);
    text-align: center;
    margin-bottom: 1.25rem;
    font-weight: 500;
    position: relative;
    z-index: 1;
  }

  .cards {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem 1.4rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: relative;
    overflow: hidden;
    transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(204,0,0,0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card::after {
    content: '';
    position: absolute;
    left: 0; top: 15%; bottom: 15%;
    width: 3px;
    background: var(--red);
    border-radius: 0 3px 3px 0;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover, .card:active {
    border-color: rgba(204,0,0,0.5);
    background: var(--dark3);
    transform: translateX(4px);
  }

  .card:hover::before, .card:active::before { opacity: 1; }
  .card:hover::after, .card:active::after { opacity: 1; }

  .card-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--red-dim);
    border: 1px solid rgba(204,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .card-icon svg { width: 22px; height: 22px; }

  .card-body { flex: 1; min-width: 0; }

  .card-city {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }

  .card-address {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.45;
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-arrow {
    color: var(--red);
    opacity: 0.5;
    transition: opacity 0.2s, transform 0.2s;
    flex-shrink: 0;
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: translateX(3px);
  }

  .footer {
    margin-top: 2.5rem;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.7s 0.5s ease both;
    opacity: 0;
  }

  .footer-text {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    opacity: 0.5;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card:nth-child(1) { animation: fadeUp 0.6s 0.1s ease both; opacity:0; }
  .card:nth-child(2) { animation: fadeUp 0.6s 0.2s ease both; opacity:0; }
  .card:nth-child(3) { animation: fadeUp 0.6s 0.3s ease both; opacity:0; }
</style>
</head>
